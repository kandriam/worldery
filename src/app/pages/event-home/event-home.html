<h1>Timeline</h1>
<div class="page-container">
  <aside class="side-menu">
    <app-search-filter 
      #searchFilterCmp
      searchLabel="Search events"
      searchPlaceholder="Search"
      [filterConfig]="filterConfig"
      [allCharacters]="allCharacters"
      [allStories]="allStories"
      [allLocations]="allLocations"
      (filterChange)="onFilterChange($event)">
    </app-search-filter>
  </aside>
  <article class="main-article">
    <div class="view-toggle">
      <button [class.active]="viewMode === 'timeline'" (click)="setViewMode('timeline')" class="view-button primary">
        📅 Timeline View
      </button>
      @if (isGregorianCalendar) {
        <button [class.active]="viewMode === 'calendar'" (click)="setViewMode('calendar')" class="view-button">
          🗓️ Calendar View
        </button>
      }
    </div>

    <div class="current-date-bar">
      <span class="current-date-pin"><img src="assets/icons/pin.svg" class="pin-icon" alt="pin"></span>
      @if (currentWorldDateService.isSet()) {
        <span class="current-date-label">World date: <strong>{{ currentWorldDateService.getFormatted() }}</strong></span>
        <button class="clear-date-btn" title="Clear world date" (click)="clearCurrentDate()">✕ Clear</button>
      } @else {
        <span class="current-date-label using-today">Using today's date — click <img src="assets/icons/pin.svg" class="pin-icon" alt="pin"> on any event to set the world date</span>
      }
    </div>
    
    @if (viewMode === 'timeline') {
      <app-timeline
        [events]="filteredEventList"
        title="Events Timeline"
        [allowAddElement]="true"
        [showDisplayToggles]="true"
        orientation="horizontal"
        noResultsMessage="No events found. Try adjusting your search or add a new event."
        (addElement)="addWorldEvent()"
        (tagClicked)="onTagClicked($event)">
      </app-timeline>
    } @else if (viewMode === 'calendar') {
      <app-calendar
        [events]="filteredEventList"
        [worldId]="worldId"
        (addEventOnDate)="onAddEventOnDate($event)">
      </app-calendar>
    }
  </article>
</div>
