<h1>Worlds</h1>
<div class="page-container">
  <article class="main-article worlds-article">
    <div class="worlds-header">
      <button class="add-button" (click)="toggleCreateForm()">New World</button>
    </div>

    <div class="create-form" *ngIf="showCreateForm">
      <form [formGroup]="createForm" (ngSubmit)="createWorld()">
        <input formControlName="title" placeholder="World name" />
        <textarea formControlName="description" placeholder="Description"></textarea>
        <div class="form-actions">
          <button type="submit">Create</button>
          <button type="button" (click)="toggleCreateForm()">Cancel</button>
        </div>
      </form>
    </div>

    <div class="worlds-grid">
      <a class="world-card" *ngFor="let world of worlds" [routerLink]="['/world']"
        [queryParams]="{ id: world.id }">
        <h2>{{ world.title || 'Untitled World' }}</h2>
        <p>{{ world.description }}</p>
        <div class="world-genres" *ngIf="world.genres?.length">
          <span class="genre-tag" *ngFor="let genre of world.genres">{{ genre }}</span>
        </div>
      </a>
      <p class="no-results" *ngIf="worlds.length === 0">No worlds yet. Create your first world above!</p>
    </div>
  </article>
</div>
