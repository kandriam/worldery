<h1>Worlds</h1>
<div class="page-container">
  <div class="worlds-article">
    <!-- <div class="worlds-header">
      <button class="add-button" (click)="toggleCreateForm()">New World</button>
    </div> -->

    <form class="create-form" [formGroup]="createForm" (ngSubmit)="createWorld()">
      <h3>Create New World</h3>
      <div class="create-form-content">
        <div>
          <label for="title">World Name</label>
          <input id="title" type="text" formControlName="title" placeholder="World name" />
          <!--
          <label for="calendar">Calendar System</label>
          <select id="calendar" formControlName="calendar">
            <option value="">Select calendar system</option>
            <option value="gregorian">Gregorian</option>

            <option value="fantasy">Fantasy (custom)</option>
          </select>
          -->
        </div>
        <div>
          <label for="description">Description</label>
          <textarea id="description" formControlName="description" placeholder="Description"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="primary" type="submit">Create</button>
        <button class="primary" type="button" (click)="toggleCreateForm()">Cancel</button>
      </div>
    </form>

    <div class="worlds-grid">
      <a class="world-card" *ngFor="let world of worlds" (click)="setCurrentWorldAndNavigate(world)">
        <h2>{{ world.title || 'Untitled World' }}</h2>
        <p>{{ world.description }}</p>
        <div class="world-genres" *ngIf="world.genres?.length">
          <span class="genre-tag" *ngFor="let genre of world.genres">{{ genre }}</span>
        </div>
      </a>
      <p class="no-results" *ngIf="worlds.length === 0">No worlds yet. Create your first world above!</p>
    </div>
  </div>
</div>
