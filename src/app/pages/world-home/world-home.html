<form [formGroup]="worldInfoForm" (ngSubmit)="saveWorldInfo()" class="world-info-form">
  <div class="world-info-container">
    <div class="world-info-header">
        <h2>
          <input class="editable-title" id="worldName" formControlName="name" placeholder="Enter world name" />
        </h2>
        @if (saveSuccess) { <span class="save-success">Saved!
          <img class="display-icon" src="assets/icons/circle-check.svg" alt="characters">  
        </span> }
        <div class="world-info-actions" style="display: flex; flex-direction: column;">
            <button type="button" class="danger secondary" (click)="deleteWorld()">Delete World</button>
            <button type="submit" class="secondary">Save</button>
        </div>
    </div>
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 5px;">
        <div class="world-field">
            <label for="worldDescription">Description</label>
            <textarea id="worldDescription" formControlName="description" placeholder="Enter world description"></textarea>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <div class="world-field">
              <label for="worldGenres">Genres <span class="hint">(comma-separated)</span></label>
              <textarea id="worldGenres" formControlName="genres" placeholder="e.g. Fantasy, Sci-Fi" ></textarea>
          </div>
          <div class="world-field">
              <label for="worldTimeSystem">Calendar System</label>
              <select id="worldTimeSystem" formControlName="timeSystem">
                <option value="gregorian">Gregorian</option>
                <option value="custom">Custom</option>
              </select>
          </div>
        </div>
    </div>
  </div>
</form>

<div class="home-page-container">
  <aside class="side-menu">
    <app-search-filter 
      searchLabel="Search World"
      searchPlaceholder="Search"
      [filterConfig]="filterConfig"
      [allCharacters]="allCharacters"
      [allStories]="allStories"
      [allLocations]="allLocations"
      (filterChange)="onFilterChange($event)">
    </app-search-filter>
  </aside>
  <article class="main-article">
    <app-home-row
      entityType="event"
      title="Timeline"
      routePath="/event"
      [entities]="filteredEventList"
      [filterIds]="{ characterIds: selectedCharacters, storyIds: selectedStories, locationIds: selectedLocations }"
      noResultsMessage="No events found. Try adjusting your search or add a new event."
      (addElement)="addWorldElement($event)"
      (tagClicked)="onTagClick($event)">
    </app-home-row>

    <app-home-row
      entityType="location"
      title="Locations"
      routePath="/location"
      [entities]="filteredLocationList"
      [filterIds]="{ locationIds: selectedLocations }"
      noResultsMessage="No locations found. Try adjusting your search or add a new location."
      (addElement)="addWorldElement($event)"
      (tagClicked)="onTagClick($event)">
    </app-home-row>

    <app-home-row
      entityType="character"
      title="Characters"
      routePath="/character"
      [entities]="filteredCharacterList"
      [filterIds]="{ characterIds: selectedCharacters, storyIds: selectedStories }"
      noResultsMessage="No characters found. Try adjusting your search or add a new character."
      (addElement)="addWorldElement($event)"
      (tagClicked)="onTagClick($event)">
    </app-home-row>

    <app-home-row
      entityType="story"
      title="Stories"
      routePath="/story"
      [entities]="filteredStoryList"
      [filterIds]="{ storyIds: selectedStories, characterIds: selectedCharacters, locationIds: selectedLocations }"
      noResultsMessage="No stories found. Try adjusting your search or add a new story."
      (addElement)="addWorldElement($event)"
      (tagClicked)="onTagClick($event)">
    </app-home-row>
  </article>
</div>
